name: 自动构建 AI Story Docker 镜像

# 扩展触发规则：main分支推送、版本标签推送、PR合并前验证、手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ] # 打v开头的版本标签时触发（如v1.0.0）
  pull_request:
    branches: [ main ] # PR提交到main分支时验证构建（不推送镜像）
  workflow_dispatch: # 支持手动触发构建

# 全局环境变量，简化后续步骤引用
env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}
  BACKEND_IMAGE: ai_story-backend
  FRONTEND_IMAGE: ai_story-frontend
  # 多架构配置
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # 构建并推送后端镜像（独立Job，支持并行）
  build-backend:
    runs-on: ubuntu-latest
    # 构建失败自动重试（最多2次，间隔5分钟）
    retry:
      max: 2
      delay-minutes: 5
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 配置QEMU（支持多架构构建）
      - name: 设置QEMU多架构支持
        uses: docker/setup-qemu-action@v3

      # 3. 配置Buildx（增强Docker构建能力）
      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录Docker Hub（仅在推送镜像时执行，PR触发时跳过）
      - name: 登录Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. 构建并推送后端镜像（带缓存、多架构、多标签）
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          # 启用缓存（加速构建）
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:buildcache,mode=max
          # 多架构构建
          platforms: ${{ env.PLATFORMS }}
          # 推送开关（PR仅构建不推送）
          push: ${{ github.event_name != 'pull_request' }}
          # 标签：latest + Commit Hash（版本追溯） + 标签（如果是打Tag触发）
          tags: |
            ${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}:{2}', env.DOCKER_HUB_REPO, env.BACKEND_IMAGE, github.ref_name) || '' }}

      # 6. 验证后端镜像（仅推送后执行）
      - name: 验证后端镜像可用性
        if: github.event_name != 'pull_request'
        run: |
          # 拉取刚推送的镜像
          docker pull ${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          # 启动测试容器（需Dockerfile中定义HEALTHCHECK，否则注释此段）
          docker run -d --name test-backend --rm \
            ${{ env.DOCKER_HUB_REPO }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          # 等待容器启动并检查健康状态
          sleep 15
          HEALTH_STATUS=$(docker inspect --format '{{.State.Health.Status}}' test-backend 2>/dev/null || echo "unhealthy")
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "后端镜像启动后健康检查失败！"
            docker logs test-backend # 输出日志便于排查
            exit 1
          fi
          # 停止测试容器
          docker stop test-backend

      # 7. 构建失败钉钉通知（可选，需配置DINGTALK_WEBHOOK Secret）
      - name: 后端构建失败通知
        if: failure() && github.event_name != 'pull_request'
        uses: fangdingjun/dingtalk-action@v2
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
          msg: |
            ❌ AI Story 后端镜像构建失败
            分支：${{ github.ref_name }}
            Commit：${{ github.sha }}
            触发方式：${{ github.event_name }}

  # 构建并推送前端镜像（独立Job，与后端并行）
  build-frontend:
    runs-on: ubuntu-latest
    retry:
      max: 2
      delay-minutes: 5
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置QEMU多架构支持
        uses: docker/setup-qemu-action@v3

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}:{2}', env.DOCKER_HUB_REPO, env.FRONTEND_IMAGE, github.ref_name) || '' }}

      - name: 验证前端镜像可用性
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker run -d --name test-frontend --rm \
            ${{ env.DOCKER_HUB_REPO }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          sleep 10
          # 检查前端容器是否正常运行（Nginx端口监听）
          if ! docker exec test-frontend curl -s http://localhost:80 >/dev/null; then
            echo "前端镜像启动后端口不可用！"
            docker logs test-frontend
            exit 1
          fi
          docker stop test-frontend

      - name: 前端构建失败通知
        if: failure() && github.event_name != 'pull_request'
        uses: fangdingjun/dingtalk-action@v2
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
          msg: |
            ❌ AI Story 前端镜像构建失败
            分支：${{ github.ref_name }}
            Commit：${{ github.sha }}
            触发方式：${{ github.event_name }}

  # 可选：验证Docker Compose（依赖前后端镜像构建完成）
  verify-compose:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend] # 等待前后端构建完成
    if: github.event_name != 'pull_request'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 登录Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 验证Docker Compose配置
        run: |
          # 复制示例环境变量（需确保.env.example包含必要配置）
          cp .env.example .env
          # 检查Compose文件语法
          docker-compose config
          # 启动所有服务并检查状态
          docker-compose up -d
          sleep 20
          # 检查所有服务是否正常运行
          RUNNING_SERVICES=$(docker-compose ps -q | wc -l)
          EXPECTED_SERVICES=$(docker-compose config --services | wc -l)
          if [ "$RUNNING_SERVICES" != "$EXPECTED_SERVICES" ]; then
            echo "Docker Compose 服务启动不全！"
            docker-compose logs
            docker-compose down
            exit 1
          fi
          # 清理测试环境
          docker-compose down
