name: 自动构建 AI Story Docker 镜像

# 触发条件：推送到 main 分支时自动执行构建
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # 云端使用 Ubuntu 环境构建
    steps:
      # 1. 拉取 GitHub 上的项目代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub（需先配置凭证）
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}  # Docker Hub 用户名（保密配置）
          password: ${{ secrets.DOCKER_HUB_TOKEN }}     # Docker Hub 访问令牌（保密配置）

      # 3. 构建并推送后端镜像（带基础重试逻辑，避免网络偶发失败）
      - name: 构建并推送后端镜像
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_NAME: ai_story-backend
          RETRY_MAX: 2  # 最大重试2次
          RETRY_DELAY: 30 # 重试间隔30秒
        run: |
          # 自定义重试逻辑（替代非法的retry字段）
          attempt=1
          while [ $attempt -le $RETRY_MAX ]; do
            echo "第 $attempt 次构建后端镜像..."
            # 执行构建推送命令
            docker build -t $DOCKER_REPO/$IMAGE_NAME:latest -f ./docker/Dockerfile .
            docker push $DOCKER_REPO/$IMAGE_NAME:latest
            
            # 构建成功则退出循环
            if [ $? -eq 0 ]; then
              echo "后端镜像推送成功！"
              exit 0
            fi
            
            # 失败则等待重试
            echo "第 $attempt 次失败，$RETRY_DELAY 秒后重试..."
            sleep $RETRY_DELAY
            attempt=$((attempt + 1))
          done
          echo "超出最大重试次数，后端镜像构建失败！"
          exit 1

      # 4. 构建并推送前端镜像（带基础重试逻辑）
      - name: 构建并推送前端镜像
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_NAME: ai_story-frontend
          RETRY_MAX: 2
          RETRY_DELAY: 30
        run: |
          attempt=1
          while [ $attempt -le $RETRY_MAX ]; do
            echo "第 $attempt 次构建前端镜像..."
            docker build -t $DOCKER_REPO/$IMAGE_NAME:latest -f ./docker/frontend.Dockerfile .
            docker push $DOCKER_REPO/$IMAGE_NAME:latest
            
            if [ $? -eq 0 ]; then
              echo "前端镜像推送成功！"
              exit 0
            fi
            
            echo "第 $attempt 次失败，$RETRY_DELAY 秒后重试..."
            sleep $RETRY_DELAY
            attempt=$((attempt + 1))
          done
          echo "超出最大重试次数，前端镜像构建失败！"
          exit 1
